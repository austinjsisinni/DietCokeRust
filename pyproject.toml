[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diet-rust"
version = "0.3.0"
description = "A Diet Coke-inspired surface dialect for Rust"
requires-python = ">=3.11"

[project.scripts]
dietc = "dietc.__main__:main"

[tool.setuptools]
packages = ["dietc"]
